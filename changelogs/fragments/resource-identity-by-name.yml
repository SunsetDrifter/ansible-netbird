---
bugfixes:
  - >-
    netbird_network - network resources are now matched by ``name``, falling back
    to ``address`` only for resources that have none. Keying on address had two
    silent consequences: two resources sharing an address, which the API allows
    and which is how one host is exposed under two names with different
    distribution groups, collapsed into one before any request was made; and
    editing an address became a delete-and-recreate, so the resource ID churned
    and anything holding it, such as a policy rule's ``destination_resource``,
    pointed at an object that no longer existed.
  - >-
    netbird_network - a resource whose ``address`` changed is now detected as
    needing an update. It was previously the identity, so a change to it could
    not be an update; the comparator did not look at it, and without that the
    edit would now be dropped.
  - >-
    netbird_network - two resources resolving to the same identity now fail the
    task, on both sides of the comparison. Dict construction resolves a
    collision by keeping the last one, and a shadowed resource on the server
    side also drops out of the delete sweep, so it survived every run unmanaged
    while the task reported success.
minor_changes:
  - >-
    netbird_network - documented that renaming a resource is a replacement
    rather than an edit. The new name matches nothing that exists, so the
    resource is deleted and recreated with a new ID, and policy rules
    referencing the old one by ``destination_resource`` need reapplying. A
    named resource's address can be changed freely; an unnamed resource is
    identified by its address, so changing that is a replacement as well.
