---
bugfixes:
  - >-
    netbird_setup_key - a task naming a revoked key no longer fails. ``revoked``
    defaults to ``false``, so the module asked to un-revoke it without the
    playbook ever mentioning the field, and the API refuses that ("can't
    un-revoke a revoked setup key") - the task died on a 422 about something it
    had not asked for. The current value is now carried forward, with a warning
    saying revocation cannot be undone. Revoking an unrevoked key, the permitted
    direction, is unchanged.
  - >-
    netbird_setup_key - a key addressed by ``key_id`` with a different
    ``name`` no longer reports ``changed: true`` on every run. The API's
    update accepts only ``revoked`` and ``auto_groups``, so the "update" never
    renamed anything; the mismatch is now reported with the other
    creation-fixed parameters instead.
minor_changes:
  - >-
    netbird_setup_key - a key matched by ``name`` that cannot enrol a peer,
    because it is revoked, expired or out of uses, now warns instead of
    reporting the desired state as met. Previously the task returned
    ``changed: false`` and the failure surfaced later, at enrolment, with
    nothing connecting the two events.
  - >-
    netbird_setup_key - added ``rotate_when_invalid``, which replaces such a
    key rather than only warning about it. Off by default, and requires
    ``name``, since that is what the replacement is created with. The
    replacement is created before the invalid key is deleted, so a failed
    create leaves the old key in place. It has no effect when
    ``revoked: true`` is the desired state, where an unusable key is what was
    asked for.
  - >-
    netbird_setup_key - warn when a task asks to change a parameter the API
    fixes at creation time (``name``, ``key_type``, ``usage_limit``,
    ``ephemeral``, ``allow_extra_dns_labels``) on a key that already exists.
    The API ignores the request, so the module no longer implies it applied.
