bugfixes:
  - >-
    configure role - a policy rule targeting a resource
    (``source_resource``/``destination_resource``) no longer fails with
    ``422 specify either destinations or destination resources, not both``
    (https://github.com/netbirdio/ansible-netbird/issues/67). The resolver
    stamped ``sources: []`` and ``destinations: []`` onto every rule, so a
    rule defined only with the resource form reached the API carrying both
    a resource reference and an empty group list, which the API rejects.
    Group references are now only resolved (and only present) when the rule
    actually defines them.
