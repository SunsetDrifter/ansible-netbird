---
minor_changes:
  - >-
    netbird_route - added the ``access_control_groups`` option, which gates which
    peers may reach the routed CIDR. It had no module surface, so any routed ACL
    required a raw API call alongside the module. Omitting the option preserves
    whatever the route already has; pass an empty list to clear it. A change to
    it is picked up by the change comparator, so it is applied rather than
    dropped.
  - >-
    routes tasks and export role - ``access_control_groups`` is now passed
    through by ``tasks/routes.yml`` and emitted by the route export template.
    Without both, the option existed on the module but could not be reached from
    the config-as-code path, and exporting a route that carried an ACL produced a
    config file which did not record it.
