bugfixes:
  - >-
    netbird_account - a task setting only one ``extra_*`` option (e.g.
    ``extra_network_traffic_logs_enabled``) no longer silently resets every
    other ``extra`` setting (``extra_peer_approval_enabled``,
    ``extra_user_approval_required``,
    ``extra_network_traffic_packet_counter_enabled``,
    ``extra_network_traffic_logs_groups``) to its zero value. The account
    settings PUT is full-replace with no server-side nil-check on ``extra``'s
    subfields, and the module only merged the desired update against the
    current settings one level deep, so a request naming a single ``extra_*``
    key replaced the whole nested object instead of merging into it. ``extra``
    is now merged at the subkey level against the current settings, the same
    pattern already used for netbird_group's full-replace fields.
