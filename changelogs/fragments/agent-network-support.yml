---
major_changes:
  - 'Full agent-network (AI gateway) management. Five new modules
    (``netbird_an_settings``, ``netbird_an_provider``, ``netbird_an_policy``,
    ``netbird_an_guardrail``, ``netbird_an_budget_rule``), nine new
    ``netbird_info`` resource types, 22 new API helpers, name-to-ID
    resolution for providers/guardrails/groups in AN policies and budget
    rules, drift detection in the diff filter, and end-to-end integration
    in the configure role (preview, apply, strict-mode sweep) and export
    role (clean + raw output). Covers the full ``/api/agent-network/*``
    surface.'

minor_changes:
  - 'netbird_an_provider - ``api_key`` is marked ``no_log`` and excluded
    from change detection (the API seals it and never returns it).'
  - 'netbird_an_provider, netbird_an_policy, netbird_an_budget_rule -
    ``enabled``, ``description``, and other optional fields have no
    argspec default. Omitting them on update carries the current value
    forward instead of silently resetting it. The API does a full replace
    on PUT, so every field must be present in the body; the modules
    handle this internally.'
  - 'netbird_an_budget_rule - omitting one sub-limit (e.g. ``budget_limit``)
    when updating ``limits`` now preserves the existing sub-limit instead
    of clearing it. Same carry-forward applies to ``target_groups``,
    ``target_users``, and ``enabled``.'
  - 'netbird_info - added ``an_settings``, ``an_providers``,
    ``an_catalog_providers``, ``an_policies``, ``an_guardrails``,
    ``an_budget_rules``, ``an_access_logs``, ``an_access_log_sessions``,
    ``an_usage_overview``, and ``an_consumption`` resource types.
    ``an_access_logs`` and ``an_access_log_sessions`` are paginated
    (max 100 per page); the response envelope includes ``total_records``
    and ``total_pages``.'
  - 'configure role - agent-network resources are loaded from
    ``agent_network.yml`` (optional file) and applied in dependency order:
    guardrails and providers first, then policies and budget rules
    (which reference providers and groups by name).'
  - 'export role - agent-network resource exports are gated with
    ``ignore_errors`` so the role works on servers without the
    agent-network API.'
