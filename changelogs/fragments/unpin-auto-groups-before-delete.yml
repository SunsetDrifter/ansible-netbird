---
minor_changes:
  - >-
    netbird_group - ``state=absent`` on a group referenced by a setup key's or a
    user's ``auto_groups`` now fails with a message naming every owner holding it,
    by email. The API's own 400 names only the first blocking reference it finds,
    in a fixed order, and identifies a user by raw ID, so a group held by three
    owners took three round trips to unpick. The new
    ``unpin_auto_groups=true`` option removes the group from those owners first
    and then deletes it, returning the owners it touched in ``unpinned``. It is
    opt-in because peers enrolled through those owners stop receiving the group.
    Either setting costs two extra list calls per ``state=absent``, since the
    owners must be found before the delete is attempted.
  - >-
    netbird_group - a failure after unpinning now carries the ``unpinned`` list,
    holding what was actually edited before the error, and an owner's own update
    failing is re-raised naming that owner. Between them they describe the whole
    partial state: the list says what succeeded, the message says what broke.
    That covers both a delete still refused by a policy or route referencing the
    group, and a failure partway through the sweep; either way the operator would
    otherwise have to reconstruct what changed from the API.
  - >-
    netbird_group - in check mode the warning now says what *would* be unpinned
    rather than reporting it in the past tense, since nothing is written.
  - >-
    netbird_api (module_utils) - ``unpin_group`` refuses the whole sweep, before
    writing anything, when the API reports no role for a user owner. The user PUT
    is full-replace and ``update_user`` drops a ``None`` role from the payload, so
    the API would read the role as empty and answer 422 "invalid user role" -
    a message saying nothing about the group being unpinned, arrived at after
    editing any earlier owners. It is the one field with no safe fallback.
