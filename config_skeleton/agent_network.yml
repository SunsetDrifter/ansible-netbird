---
# NetBird Agent Network (AI Gateway)
#
# The agent-network feature proxies LLM API calls through the NetBird
# overlay, adding access control, budget/token limits, guardrails,
# and observability.
#
# Populate from export: netbird_config_export/agent_network.yml
#
# Providers are matched by name (unique). API keys are sealed and
# never returned — re-enter them before applying an exported config.
# source_groups and target_groups use plain group names (resolved
# automatically). destination_provider_ids and guardrail_ids use
# provider/guardrail names (resolved automatically).
#
# All fields use carry-forward on update — omit a field to keep its
# current value. To disable a sub-limit or sub-check, include it
# with enabled: false rather than omitting it.
#
# Reference: https://docs.netbird.io/api/resources/agent-network

netbird_an_settings: {}
